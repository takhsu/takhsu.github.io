<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>puru 搬家了</title>
<link rel="canonical" href="https://puru-app.github.io/puru/">
<meta http-equiv="refresh" content="0; url=https://puru-app.github.io/puru/">
<meta name="robots" content="noindex">
<script>
// puru 的網站搬到新網址：保留原本網址後面的路徑、查詢與錨點
(function () {
  var rest = location.pathname.replace(/^\/puru\/?/, '');
  location.replace('https://puru-app.github.io/puru/' + rest + location.search + location.hash);
})();
</script>
</head>
<body>
<p>puru 的網站搬到 <a href="https://puru-app.github.io/puru/">https://puru-app.github.io/puru/</a> 了。</p>
</body>
</html>
